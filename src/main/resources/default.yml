# ============================
# KBM的默认配置
# ============================

# ============================
# 水平方向击退修改
# ============================
horizontal:
  # 地面击退距离
  ground: 0.4
  # 空中击退距离
  air: 0.4
  # 疾跑时增加的击退距离
  sprint_extra: 0.5

# ============================
# 垂直方向击退修改
# ============================
vertical:
  # 地面击退距离
  ground: 0.36075
  # 空中击退距离
  air: 0.24775
  # 疾跑时增加的击退距离
  sprint_extra: 0.1

# ============================
# 投掷物击退修改
# ============================
projectile:
  # 是否启用此修改
  enabled: false
  # 投掷物造成的水平方向击退距离的乘以倍数
  horizontal_multiplier: 1.0
  # 投掷物造成的垂直方向击退距离的乘以倍数
  vertical_multiplier: 1.0
  # 是否使用投掷物发射者的位置来计算击退方向
  direction_override: false

# ============================
# 数据包修改
# ============================
packet:
  # ----------------------------
  # 将位置更新包错位
  # ----------------------------
  misplace:
    # 是否开启错位
    enabled: false
    # 错位距离
    distance: 0.1 # (单位: 格)
  # ----------------------------
  # 延迟发送位置更新包
  # ----------------------------
  delay:
    # 是否开启延迟发送
    enabled: false
    # 延迟发送的时间
    ticks: 2 # (单位: 游戏刻)

# ============================
# 重置疾跑
# ============================
stop_sprint: true

# ============================
# Y 轴高度限制
# ============================
y_limit: 0.675 # (单位: 格)

# ============================
# 攻击速度
# ============================
hit_delay: 20 # (单位: 游戏刻)

# ============================
# 投掷出的喷溅型药水的运动修改
# ============================
potion:
  # 是否启用此修改
  enabled: false
  # 药水的水平方向运动的乘以倍数
  horizontal_multiplier: 1.05
  # 药水的垂直方向运动的乘以倍数
  vertical_multiplier: 1.0
  # 药水命中自身时的强度补偿倍数
  compensation_multiplier: 1.15